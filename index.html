<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSUIガード</title>
    <!-- PWAのための設定 -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d0d1a;
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            margin: 0;
            transition: background-color 0.5s;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #8888aa;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-main {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
            width: 80%;
            margin-top: 20px;
        }
        .btn-check {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #0d0d1a;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 90%;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
        }
        #test-screen {
            display: none;
        }
        .word-display {
            font-size: 1.4rem;
            background: #1a1a3a;
            padding: 20px 15px;
            border-radius: 10px;
            margin: 20px 0;
            color: #ffcc00;
            font-weight: bold;
            line-height: 1.6;
            word-break: break-all;
        }
        .input-box {
            width: 90%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 2px solid #00ffcc;
            background: #0d0d1a;
            color: white;
            text-align: center;
        }
        .timer {
            font-size: 1.2rem;
            color: #ff3333;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DSUI GUARD</h1>
    <div class="subtitle">- 泥酔スマホ操作防止システム -</div>

    <!-- スタート画面 -->
    <div id="start-screen" class="card">
        <p>これより夜の街へ出撃します。<br>やらかす前にプロテクトを起動してください。</p>
        <button class="btn-main" onclick="openTest()">🔒 ガード起動</button>
    </div>

    <!-- テスト画面 -->
    <div id="test-screen" class="card">
        <h3>【シラフ検査：超激ムズ早口言葉】</h3>
        <p>以下の早口言葉を**ひらがな**で正確に入力し、一番下のボタンを押してください。<br><strong style="color: #ff3333;">※1文字でも間違えたら即アウトです。</strong></p>
        
        <div class="word-display" id="target-word"></div>
        
        <input type="text" id="user-input" class="input-box" placeholder="ここにひらがなで入力">
        
        <button class="btn-check" onclick="checkInputFinal()">🔍 シラフ判定を行う</button>
        
        <div class="timer" id="timer-display">残り時間: 30 秒</div>
    </div>
</div>

<script>
    // 最凶の激ムズ早口言葉リスト
    const tongueTwisters = [
        "魔術師マサチューセッツ州知事選出馬、手術中につき急遽出馬却下",
        "メール二十二通中二十通がフルーツジュース抽出中",
        "新進シャンソン歌手総出演新春シャンソンショー",
        "東京特許許可局局長今日急遽休暇許可拒否",
        "歌唄いが来て歌唄えと言うが、歌唄いくらい歌うまければ歌唄うが、歌唄いくらい歌うまくないので歌唄わぬ"
    ];

    const tongueTwistersKana = [
        "まじゅつしまさちゅーせっつしゅうちじせんしゅつばしゅじゅつちゅうにつききゅうきょしゅつばきゃっか",
        "めーるにじゅうにつうちゅうにじゅっつうがふるーつじゅーすちゅうしゅつちゅう",
        "しんしんしゃんそんかしゅそうしゅつえんしんしゅんしゃんそんしょー",
        "とうきょうとっきょきょかきょくきょくちょうきょうきゅうきょきゅうかきょかきょひ",
        "うたうたいがきてうたうたえというがうたうたいくらいうたうまければうたうたうがうたうたいくらいうたうまくないのでうたうたわぬ"
    ];

    let selectedIndex = 0;
    let timeLeft = 30; // 必要に応じてここを20に縮めるとさらに絶望的になります
    let timerInterval;

    function openTest() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('test-screen').style.display = 'block';
        
        selectedIndex = Math.floor(Math.random() * tongueTwisters.length);
        
        document.getElementById('target-word').innerHTML = 
            `${tongueTwisters[selectedIndex]}<br><span style="font-size:0.9rem; color:#aaa;">（${tongueTwistersKana[selectedIndex]}）</span>`;
        
        document.getElementById('user-input').focus();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = `残り時間: ${timeLeft} 秒`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                gameOver("時間切れ！呂律（ろれつ）が回っていません。おやすみなさい。");
            }
        }, 1000);
    }

    // シラフ判定（一撃アウトモード）
    function checkInputFinal() {
        const targetKana = tongueTwistersKana[selectedIndex];
        const userText = document.getElementById('user-input').value.trim();

        // 完璧に一致している場合のみクリア
        if (userText === targetKana) {
            clearInterval(timerInterval);
            alert("見事な滑舌！あなたはシラフです。スマホの使用を許可します。");
            // LINEアプリを強制的に開く
            window.location.href = "line://"; 
        } else {
            // 1文字でも違えば即ゲームオーバー
            clearInterval(timerInterval);
            gameOver("1文字でも間違えたら即アウトです。指がもつれすぎてお話になりません。スマホを裏返して寝てください。");
        }
    }

    function gameOver(message) {
        document.body.style.backgroundColor = "#550000";
        document.getElementById('test-screen').innerHTML = `
            <h2 style="color: #ff3333;">⚠️ DSUIガード作動：泥酔認定</h2>
            <p style="font-size: 1.3rem; font-weight: bold; margin: 30px 0;">${message}</p>
            <button class="btn-main" style="background: #333;" onclick="location.reload()">もう一度テスト（水飲んでから）</button>
        `;
    }
</script>

</body>
</html>
